<!DOCTYPE html>
<html>
<head>
  <title>Pixel Art Designer</title>
  <style>
    body {
      background-color: #666666;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    .main {
      width: 80%;
      margin: 40px auto;
      background-color: #444;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }

    .whInfo input {
      width: 40px;
      font-size: 20px;
      padding: 5px;
      border: none;
      border-radius: 5px;
    }

    .whInfo {
      font-size: 20px;
      color: #fff;
      margin-bottom: 20px;
    }
    
    #drawArea {
      width: 90%;
      border-collapse: collapse;
      margin: 20px auto;
    }

    td {
      background-color: #fff;
      width: 15px;
      height: 15px;
      padding: 0;
      overflow: hidden;
      border-sizing:border-box;
    }

    button {
      width: 200px;
      height: 50px;
      font-size: 22px;
      font-weight: bold;
      background-color: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background-color: #3e8e41;
    }

    #colorInput {
      width: 50px;
      height: 30px;
      border: none;
      border-radius: 5px;
    }
    .brush {
        color:white;
        font-size:22px;
    }
    .tool {
        color:white;
        font-size:18px;
    }
    footer {
      text-align:center;
      font-weight:bold;
      font-size:18px;
      color:#ffffff;
      margin-top:50px;
    }
  </style>
</head>
<body>
  <section class="main">
    <div class="whInfo">Canvas Size: <input type="number" value="16" id="colNo">x<input type="number" value="16" id="rowNo"></div>
    <button onclick="generate(document.getElementById('rowNo').value, document.getElementById('colNo').value)">Make Canvas</button>
    <br />
    <table id="drawArea" cellspacing="0" border="0" align="center"></table>
    <br />
    <div class='brush'>Brush Color: <input type="color" id="colorInput" value="#000000"></div><br />
    <div class='tool'>Paint Whole Canvas with <input type='color' value='#ffffff' oninput='paintCanvas()'> </div>
  </section>

  <footer>
    Created By Unknown Decoder <br />
    All Copyrights Reserved © <br />
    Made on 30th April, 2025
  </footer>

  <script>
    const colorInput = document.getElementById('colorInput')

    function generate(rows, cols) {
      let drawArea = document.getElementById('drawArea');
      let canvasWidth = drawArea.offsetWidth;
      let cellSize = canvasWidth / cols;
      drawArea.innerHTML = '';
      for (let i = 0; i < rows; i++) {
        let row = drawArea.insertRow(-1);
        for (let j = 0; j < cols; j++) {
          let cell = row.insertCell(-1);
          cell.textContent = '';
          cell.onclick = function() {
            paint(cell)
          };
          cell.style.width = `${cellSize}px`;
          cell.style.height = `${cellSize}px`;
        }
      }
    }

    function paint(element) {
      element.style.backgroundColor = colorInput.value;
    }

    generate(document.getElementById('rowNo').value, document.getElementById('colNo').value);

   document.querySelectorAll("input[type='number']").forEach((input) => {
      input.addEventListener('input', () => {
        if (input.value > 64 || input.value < 1) {
          input.value = input.value.slice(0, -1);
        }
      })
    })
    function paintCanvas() {
        if (confirm("Are you sure you want to paint the whole canvas to that color?")) {
            document.querySelectorAll("td").forEach((cell) => {
                cell.style.backgroundColor = document.querySelector(".tool input").value
            })
        }
    }
  </script>
</body>
</html>
